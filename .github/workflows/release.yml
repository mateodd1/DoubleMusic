name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          VERSION=$(python3 packaging/check-version.py)
          test "$RELEASE_REF" = "refs/tags/v$VERSION"
          printf 'VERSION=%s\nIMAGE=ghcr.io/%s\n' "$VERSION" "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: doublemusic:test
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Test Rust and catalog contracts
        run: |
          docker run --rm --network none -v "$PWD/test:/app/test:ro" doublemusic:test npm test
          docker run --rm --network none -e RUST_CORE_BIN=/usr/local/bin/doublemusic-core -e CONNECT_DISABLED=true -v "$PWD/test:/app/test:ro" doublemusic:test npm test
          node scripts/test-container.cjs
      - name: Build DEB and RPM packages
        uses: docker/build-push-action@v6
        with:
          context: .
          target: packages
          outputs: type=local,dest=dist
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Test installation, upgrade and removal
        run: scripts/test-packages.sh
      - name: Test the native systemd service
        run: packaging/test-systemd.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish architecture image and offline archive
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag doublemusic:test "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"
          docker tag doublemusic:test "doublemusic:$VERSION"
          docker image save "doublemusic:$VERSION" | gzip -1 > "dist/doublemusic_${VERSION}_linux_${ARCH}.docker.tar.gz"
          (cd dist && sha256sum "doublemusic_${VERSION}_linux_${ARCH}.docker.tar.gz" >> "SHA256SUMS-$ARCH")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture tags
        run: |
          VERSION=$(python3 packaging/check-version.py)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:${VERSION%.*}" -t "$IMAGE:${VERSION%%.*}" -t "$IMAGE:latest" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && cat SHA256SUMS-amd64 SHA256SUMS-arm64 > SHA256SUMS && sha256sum --check SHA256SUMS)
          VERSION=$(python3 packaging/check-version.py)
          gh release create "v$VERSION" --verify-tag --title "DoubleMusic $VERSION" --notes-file packaging/RELEASE_NOTES.md dist/*
