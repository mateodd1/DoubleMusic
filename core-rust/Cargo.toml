[package]
name = "doublemusic-core"
version = "1.4.1"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
